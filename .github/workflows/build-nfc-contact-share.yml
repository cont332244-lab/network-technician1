name: Build NFC Contact Share APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'nfc-contact-share/**'
      - '.github/workflows/build-nfc-contact-share.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: nfc-contact-share
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Raqmi-NFC-Abu-Wessam-APK
          path: nfc-contact-share/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
