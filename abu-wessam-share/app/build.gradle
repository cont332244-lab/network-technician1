plugins { id 'com.android.application' }

android {
    namespace 'com.abuwessam.share'
    compileSdk 35
    defaultConfig {
        applicationId 'com.abuwessam.share'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
